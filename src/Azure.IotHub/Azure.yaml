Common:
  Target       : DataPort                                                                          # required: Id String to identify the target of the file
  ContentType  : Rules                                                                             # required: Id String to identify the content of the file
  Version      : 0.32.0                                                                            # required: Version of the file
  Date         : 2026-05-11                                                                        # required: Date of the file
  Description  : "Azure IoT Hub DataPort"                                                          # required: Description of the file
  Author       : "ifm software gmbh"                                                               # required: Author of the file
  MetadataType : YAML                                                                              # required: Metadata type of the file (YAML, JSON, XML, Text, Binary, ...)
  Namespace    : "ViciOne.DataPort.Azure.IotHub"                                                   # required: Namespace of the DataPort

Root:
  Id                       : "AzureIotHubDataPort"                                                 # required: Id String to identify the root of the DataPort
  Name                     : "Azure IoT Hub"                                                       # required: display name of the DataPort
  Description              : "DataPort for Azure IoT Hub"                                          # required: display description of the DataPort
  Icon                     : azure-iot-hub                                                         # required: just one Icon for the DataPort
  ChildNodes               :
    - Id                   : AzureIotInstance
      MaxInstances         : 16

Nodes:
  - Id                     : AzureIotInstance
    Type                   : DataPortNode
    Name                   : "Instance"
    Description            : "Azure instance"
    MetadataLength         : 0
    Icon                   : server
    TransferDirections     : [ Outbound, Inbound ]
    ChildNodes             :
      - Id                 : Device
        Required           : true
        MaxInstances       : 16
    PropertyCategories     :
      - Id                 : Connection
        Properties         :
          - Id             : Hostname
            Required       : true
          - Id             : SharedAccessSignatureKey
            Required       : true
          - Id             : SharedAccessSignatureKeyName
            Required       : true
          - Id             : MaxPendingMessages
          - Id             : BulkSize

  - Id                     : Device
    MappingId              : Device
    Type                   : DataPortTreeNode
    Name                   : "Device"
    Description            : "Azure IoT Hub device"
    Icon                   : device
    ChildNodes             :
      - Id                 : Telemetry
        MaxInstances       : 1
      - Id                 : Properties
        MaxInstances       : 1

  - Id                     : Telemetry
    MappingId              : Telemetry
    Type                   : DataPortTreeNode
    Name                   : "Telemetry"
    NameIsReadOnly         : true
    Description            : "Telemetry data"
    Icon                   : folder
    TransferModes          : [ OnChange, Periodic, None ]
    ChildNodes             :
      - Id                 : JsonStructure
      - Id                 : DataPointBool
      - Id                 : DataPointInteger
      - Id                 : DataPointFloat
      - Id                 : DataPointDateTime
      - Id                 : DataPointString
      - Id                 : DataPointBinary

  - Id                     : Properties
    MappingId              : Properties
    Type                   : DataPortTreeNode
    Name                   : "Properties"
    NameIsReadOnly         : true
    Description            : "Properties data"
    Icon                   : folder
    ChildNodes             :
      - Id                 : Reported
        MaxInstances       : 1
      - Id                 : Desired
        MaxInstances       : 1

  - Id                     : Reported
    MappingId              : Reported
    Type                   : DataPortTreeNode
    Name                   : "Reported"
    NameIsReadOnly         : true
    Description            : "Reported properties data"
    Icon                   : folder
    TransferModes          : [ OnChange, Periodic, None ]
    TransferDirections     : [ Outbound ]
    ChildNodes             :
      - Id                 : JsonStructure
      - Id                 : DataPointBool
      - Id                 : DataPointInteger
      - Id                 : DataPointFloat
      - Id                 : DataPointDateTime
      - Id                 : DataPointString
      - Id                 : DataPointBinary

  - Id                     : Desired
    MappingId              : Desired
    Type                   : DataPortTreeNode
    Name                   : "Desired"
    NameIsReadOnly         : true
    Description            : "Desired properties data"
    Icon                   : folder
    TransferModes          : [ OnChange, Periodic, None ]
    TransferDirections     : [ Inbound ]
    ChildNodes             :
      - Id                 : JsonStructure
      - Id                 : DataPointBool
      - Id                 : DataPointInteger
      - Id                 : DataPointFloat
      - Id                 : DataPointDateTime
      - Id                 : DataPointString
      - Id                 : DataPointBinary

  - Id                     : JsonStructure
    MappingId              : JsonStructure
    Type                   : DataPortTreeNode
    Name                   : "JSON structure"
    Description            : "JSON structure node in the tree"
    Icon                   : folder
    TransferModes          : [ None ]
    ChildNodes             :
      - Id                 : JsonStructure
      - Id                 : DataPointBool
      - Id                 : DataPointInteger
      - Id                 : DataPointFloat
      - Id                 : DataPointDateTime
      - Id                 : DataPointString
      - Id                 : DataPointBinary

  - Id                     : DataPointBool
    MappingId              : JsonStructure
    Type                   : DataPortTreeNode
    Name                   : "DataPoint Bool"
    Description            : "Boolean data point in the tree"
    Icon                   : datapoint
    TransferModes          : [ None ]
    DataTypes              : [ Bool ]

  - Id                     : DataPointInteger
    MappingId              : JsonStructure
    Type                   : DataPortTreeNode
    Name                   : "DataPoint Integer"
    Description            : "Integer data point in the tree"
    Icon                   : datapoint
    TransferModes          : [ None ]
    DataTypes              : [ Int32, Int64, Int16, Int8, UInt32, UInt64, UInt16, UInt8 ]

  - Id                     : DataPointFloat
    MappingId              : JsonStructure
    Type                   : DataPortTreeNode
    Name                   : "DataPoint Float"
    Description            : "Float data point in the tree"
    Icon                   : datapoint
    TransferModes          : [ None ]
    DataTypes              : [ Float64, Float32 ]

  - Id                     : DataPointDateTime
    MappingId              : JsonStructure
    Type                   : DataPortTreeNode
    Name                   : "DataPoint DateTime"
    Description            : "DateTime data point in the tree"
    Icon                   : datapoint
    TransferModes          : [ None ]
    DataTypes              : [ DateTime ]

  - Id                     : DataPointString
    MappingId              : JsonStructure
    Type                   : DataPortTreeNode
    Name                   : "DataPoint String"
    Description            : "String data point in the tree"
    Icon                   : datapoint
    TransferModes          : [ None ]
    DataTypes              : [ String ]

  - Id                     : DataPointBinary
    MappingId              : JsonStructure
    Type                   : DataPortTreeNode
    Name                   : "DataPoint Binary"
    Description            : "Binary data point in the tree"
    Icon                   : datapoint
    TransferModes          : [ None ]
    DataTypes              : [ Binary ]

PropertyCategories:
  - Id                     : Connection
    Name                   : "Connection"
    Description            : "Connection properties"

Properties:
  - Id          : Hostname
    Name        : "Hostname"
    Description : "Hostname of the Azure IoT Hub"
    DataType    : String
    UiControl   : TextBox

  - Id          : SharedAccessSignatureKey
    Name        : "Shared Access Signature Key"
    Description : "Shared access signature key of the Azure IoT Hub"
    DataType    : String
    UiControl   : PasswordBox

  - Id          : SharedAccessSignatureKeyName
    Name        : "Shared Access Signature Key Name"
    Description : "Shared access signature key name of the Azure IoT Hub"
    DataType    : String
    UiControl   : TextBox

  - Id          : MaxPendingMessages
    Name        : "MaxPendingMessages"
    Description : "Maximum of pending messages"
    DataType    : Int32
    DefaultValue: 100000
    UiControl   : NumericUpDown
    MinValue    : 1

  - Id          : BulkSize
    Name        : "BulkSize"
    Description : "BulkSize"
    DataType    : Int32
    DefaultValue: 5000
    UiControl   : NumericUpDown
    MinValue    : 1

Icons:

  - Id          : azure-iot-hub
    Content     : 
    ContentType : Base64

  - Id          : device
    Content     : 
    ContentType : Base64
